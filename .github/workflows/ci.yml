# Chaque push et pull request : lint, types du front, tests du back (couverture 100 % exigée).
# Push sur main avec la variable de dépôt DEPLOY=true : image publiée sur ghcr.io puis déployée par SSH
# (secrets et variables à créer : voir README, section « Production »).
name: CI

on:
  push:
  pull_request:

# Un seul déploiement à la fois ; un push plus récent annule celui en attente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Même image que le Dockerfile.
    container: node:26.10.0-alpine3.24
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: socle
          POSTGRES_PASSWORD: socle
          POSTGRES_DB: socle
        options: --health-cmd "pg_isready -U socle" --health-interval 2s --health-retries 15
    env:
      DATABASE_URL: postgres://socle:socle@postgres:5432/socle
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npm run lint -w backend
      - run: npm run typecheck -w frontend
      - run: npm run db:migrate -w backend
      # Unitaires + e2e + intégration en une passe, avec la couverture.
      - run: npm run test:cov -w backend

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        # ghcr.io exige un nom en minuscules.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      # Tag du commit pour revenir en arrière, `latest` pour le serveur.
      - uses: docker/build-push-action@v6
        with:
          target: prod
          push: true
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }},${{ steps.name.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
    outputs:
      image: ${{ steps.name.outputs.image }}

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docker-compose.prod.yml
          sparse-checkout-cone-mode: false
      - name: Déployer sur le serveur
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          APP_DIR: ${{ vars.APP_DIR }}
          IMAGE: ${{ needs.image.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          scp docker-compose.prod.yml "$SSH_TARGET":"$APP_DIR"/
          # Secrets passés sur l'entrée standard (jamais en ligne de commande ni dans les logs) et recopiés dans le .env
          # du serveur, qui garde ses autres réglages (DOMAIN, POSTGRES_PASSWORD, APP_PORT). Le serveur ne garde aucun
          # identifiant GitHub ; les anciennes images de l'appli sont retirées après le démarrage de la nouvelle.
          printf '%s\n%s\n%s\n%s\n' "$GHCR_TOKEN" "$BREVO_API_KEY" "$MAIL_FROM" "$IMAGE" | ssh "$SSH_TARGET" "read -r GHCR_TOKEN \
            && read -r BREVO_API_KEY && read -r MAIL_FROM && read -r IMAGE \
            && test -n \"\$BREVO_API_KEY\" && test -n \"\$MAIL_FROM\" \
            && cd $APP_DIR \
            && (umask 077; grep -Ev '^(BREVO_API_KEY|MAIL_FROM|IMAGE)=' .env > .env.new; \
              printf 'BREVO_API_KEY=%s\nMAIL_FROM=%s\nIMAGE=%s\n' \"\$BREVO_API_KEY\" \"\$MAIL_FROM\" \"\$IMAGE\" >> .env.new) \
            && mv .env.new .env \
            && echo \"\$GHCR_TOKEN\" | docker login ghcr.io -u ${{ github.actor }} --password-stdin \
            && export IMAGE_TAG=${{ github.sha }} \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d \
            && (docker rmi \$(docker images -q \$IMAGE) 2>/dev/null; docker image prune -f); docker logout ghcr.io"
