# Production : image construite par la CI (.github/workflows/ci.yml), rien à construire sur le serveur.
# Variables lues dans .env (voir .env.example) ; IMAGE_TAG = commit à déployer, `latest` par défaut.
# HTTPS assuré par le reverse proxy du serveur (Caddy, Nginx…) vers 127.0.0.1:${APP_PORT} ; l'API est servie par le front sous /api.
name: socle

x-app: &app
  image: ${IMAGE:?}:${IMAGE_TAG:-latest}
  restart: unless-stopped

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      - POSTGRES_USER=socle
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?}
      - POSTGRES_DB=socle
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socle -d socle"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    <<: *app
    working_dir: /repo/backend
    command: sh -c "npm run db:migrate && npm run start:prod"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - COOKIE_SECURE=true
      - DATABASE_URL=postgres://socle:${POSTGRES_PASSWORD}@db:5432/socle
      - APP_URL=https://${DOMAIN:?}
      - BREVO_API_KEY=${BREVO_API_KEY:?}
      - MAIL_FROM=${MAIL_FROM:?}

  frontend:
    <<: *app
    working_dir: /repo/frontend
    command: node .output/server/index.mjs
    depends_on: [backend]
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

volumes:
  db-data:
